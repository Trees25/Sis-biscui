<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Cone Gradient -->
    <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbd094" />
      <stop offset="100%" stop-color="#d88b35" />
    </linearGradient>
    <!-- Bottom Scoop Gradient (Mint/Cyan) -->
    <linearGradient id="blueScoop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5be2ff" />
      <stop offset="100%" stop-color="#00a3e0" />
    </linearGradient>
    <!-- Top Scoop Gradient (Strawberry Pink) -->
    <linearGradient id="pinkScoop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8da1" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>
    <!-- Cherry Gradient -->
    <radialGradient id="cherryGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff5e7e" />
      <stop offset="70%" stop-color="#e6002d" />
      <stop offset="100%" stop-color="#99001a" />
    </radialGradient>
    
    <!-- Cone Clip Path -->
    <clipPath id="coneClip">
      <path d="M18,32 L32,60 L46,32 Z" />
    </clipPath>
  </defs>

  <!-- Cone Group with Clip -->
  <g clip-path="url(#coneClip)">
    <path d="M18,32 L32,60 L46,32 Z" fill="url(#coneGrad)" />
    <!-- Grid lines -->
    <g stroke="#9b560c" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
      <line x1="8" y1="28" x2="38" y2="58" />
      <line x1="16" y1="28" x2="46" y2="58" />
      <line x1="24" y1="28" x2="54" y2="58" />
      <line x1="56" y1="28" x2="26" y2="58" />
      <line x1="48" y1="28" x2="18" y2="58" />
      <line x1="40" y1="28" x2="10" y2="58" />
    </g>
  </g>

  <!-- Shadow under bottom scoop -->
  <path d="M16,32 Q32,36 48,32 Q32,29 16,32 Z" fill="#000000" opacity="0.15" />

  <!-- Bottom Scoop (Mint/Cyan) -->
  <circle cx="32" cy="28" r="14" fill="url(#blueScoop)" />
  <!-- Bottom scoop drip or detail (to make it look organic) -->
  <path d="M18,28 Q18,33 22,33 Q26,33 26,29 Q32,34 38,29 Q38,33 42,33 Q46,33 46,28" fill="url(#blueScoop)" />

  <!-- Shadow under top scoop -->
  <circle cx="32" cy="28" r="14" fill="none" />
  <path d="M21,19 Q32,22 43,19 Q32,16 21,19 Z" fill="#000000" opacity="0.1" />

  <!-- Top Scoop (Pink) -->
  <circle cx="32" cy="17" r="11" fill="url(#pinkScoop)" />
  <!-- Top scoop drip/curves -->
  <path d="M21,17 Q21,21 25,21 Q29,21 29,18 Q32,21 35,18 Q35,21 39,21 Q43,21 43,17" fill="url(#pinkScoop)" />

  <!-- Cherry Stem -->
  <path d="M32,6 Q38,0 43,3" stroke="#6b0e1e" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Cherry -->
  <circle cx="32" cy="7" r="4.5" fill="url(#cherryGrad)" />
  <!-- Cherry Highlight -->
  <circle cx="30.5" cy="5.5" r="1" fill="#ffffff" opacity="0.8" />
</svg>